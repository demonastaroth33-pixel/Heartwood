<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Heartwood — a private archive for your life.">
  <meta name="theme-color" content="#0C0E0A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heartwood">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Heartwood</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ============ HEARTWOOD BOOT SPLASH — shows while WASM loads ============ */
    #hw-splash{
      position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:20px; overflow:hidden;
      background:radial-gradient(ellipse at 50% 42%, #171B12 0%, #0C0E0A 68%);
      opacity:1; transition:opacity calc(.7s * var(--pace,1)) cubic-bezier(.16,.8,.3,1), visibility calc(.7s * var(--pace,1));
    }
    #hw-splash.done{opacity:0; visibility:hidden; pointer-events:none;}
    #hw-splash .mote{position:absolute; bottom:38%; width:3px; height:3px; border-radius:50%;
      background:#A9C28C; opacity:0;}
    #hw-splash .m1{left:38%; animation:floatMote calc(3.4s * var(--pace,1)) ease-in calc(.3s * var(--pace,1)) infinite;}
    #hw-splash .m2{left:60%; animation:floatMote calc(3.8s * var(--pace,1)) ease-in calc(1.1s * var(--pace,1)) infinite;}
    #hw-splash .m3{left:47%; animation:floatMote calc(3.1s * var(--pace,1)) ease-in calc(2s * var(--pace,1)) infinite;}
    #hw-splash .m4{left:52%; animation:floatMote calc(4.6s * var(--pace,1)) ease-in calc(2.8s * var(--pace,1)) infinite;}
    #hw-splash .m5{left:33%; animation:floatMote calc(4.1s * var(--pace,1)) ease-in calc(1.7s * var(--pace,1)) infinite;}
    @keyframes floatMote{0%{opacity:0; transform:translateY(0) scale(.6);}15%{opacity:.7;}80%{opacity:0;}100%{transform:translateY(-70px) scale(1);}}
    #hw-splash .glow{
      position:absolute; width:280px; height:280px; border-radius:50%;
      background:radial-gradient(circle, rgba(169,194,140,.16) 0%, transparent 62%);
      top:50%; left:50%; transform:translate(-50%,-50%);
      animation:glowBreathe calc(4.2s * var(--pace,1)) ease-in-out infinite; pointer-events:none;
    }
    @keyframes glowBreathe{0%,100%{opacity:.55; transform:translate(-50%,-50%) scale(.92);}50%{opacity:1; transform:translate(-50%,-50%) scale(1.08);}}
    #hw-splash svg.mark{width:104px; height:104px; color:#A9C28C; position:relative; z-index:2; overflow:visible;
      animation:markSettle calc(1.2s * var(--pace,1)) cubic-bezier(.16,.8,.3,1) calc(.8s * var(--pace,1)) both;}
    @keyframes markSettle{0%{transform:scale(.94);}100%{transform:scale(1);}}
    #hw-splash .soil{stroke-dasharray:34; stroke-dashoffset:34; animation:draw calc(.5s * var(--pace,1)) var(--ease, cubic-bezier(.16,.8,.3,1)) forwards; opacity:.5;}
    #hw-splash .stem{stroke-dasharray:60; stroke-dashoffset:60; animation:draw calc(1.05s * var(--pace,1)) cubic-bezier(.65,0,.35,1) forwards calc(.15s * var(--pace,1));}
    #hw-splash .root{stroke-dasharray:34; stroke-dashoffset:34; opacity:.45; animation:draw 1.05s cubic-bezier(.65,0,.35,1) forwards .15s;}
    #hw-splash .leafL{stroke-dasharray:40; stroke-dashoffset:40; animation:draw calc(.85s * var(--pace,1)) cubic-bezier(.65,0,.35,1) forwards calc(.58s * var(--pace,1));}
    #hw-splash .leafR{stroke-dasharray:40; stroke-dashoffset:40; animation:draw calc(.85s * var(--pace,1)) cubic-bezier(.65,0,.35,1) forwards calc(.76s * var(--pace,1));}
    #hw-splash .ripple{stroke-dasharray:3 5; opacity:0; transform-origin:52px 78px; animation:ripple calc(1s * var(--pace,1)) cubic-bezier(.16,.8,.3,1) forwards calc(1.05s * var(--pace,1));}
    #hw-splash .ripple2{stroke-dasharray:3 5; opacity:0; transform-origin:52px 78px; animation:ripple calc(1.5s * var(--pace,1)) cubic-bezier(.16,.8,.3,1) forwards calc(1.7s * var(--pace,1));}
    @keyframes draw{to{stroke-dashoffset:0;}}
    @keyframes ripple{0%{opacity:.9; transform:scale(.3);} 100%{opacity:0; transform:scale(1.9);}}
    #hw-splash .word{font-family:'Fraunces', Georgia, serif; font-style:italic; font-weight:400; font-size:21px;
      letter-spacing:.02em; color:#A5A791; opacity:0; animation:fadeUp calc(.6s * var(--pace,1)) cubic-bezier(.16,.8,.3,1) forwards calc(1.05s * var(--pace,1)),
      wordBloom calc(4.5s * var(--pace,1)) ease-in-out calc(1.9s * var(--pace,1)) infinite alternate; position:relative; z-index:2;}
    #hw-splash .subline{font-family:'JetBrains Mono', 'Courier New', monospace; font-size:10.5px;
      letter-spacing:.16em; text-transform:uppercase; color:#6C6E5D; opacity:0;
      animation:fadeUp calc(.6s * var(--pace,1)) cubic-bezier(.16,.8,.3,1) forwards calc(1.25s * var(--pace,1)), trackExpand calc(4.5s * var(--pace,1)) ease-in-out calc(2.2s * var(--pace,1)) infinite alternate;
      position:relative; z-index:2;}
    @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
    @keyframes wordBloom{from{text-shadow:0 0 0px rgba(169,194,140,0);} to{text-shadow:0 0 18px rgba(169,194,140,.35);}}
    @keyframes trackExpand{from{letter-spacing:.16em;} to{letter-spacing:.22em;}}
    @media (prefers-reduced-motion: reduce){
      #hw-splash *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
    }
    html,body{background:#0C0E0A; margin:0; height:100%;}
  </style>
</head>
<body>
  <div id="hw-splash">
    <div class="glow"></div>
    <div class="mote m1"></div><div class="mote m2"></div><div class="mote m3"></div>
    <div class="mote m4"></div><div class="mote m5"></div>
    <svg class="mark" viewBox="0 0 104 104" fill="none">
      <line class="soil" x1="32" y1="78" x2="72" y2="78" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <circle class="ripple" cx="52" cy="78" r="30" stroke="currentColor" stroke-width="1.2" fill="none"/>
      <circle class="ripple2" cx="52" cy="78" r="30" stroke="currentColor" stroke-width="1" fill="none"/>
      <path class="stem" d="M52 78V44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="root" d="M52 78c-4 5-6 10-5 16M52 78c4 5 6 10 5 16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <path class="leafL" d="M52 58C52 47 44 42 34 42c1.5 12 10 16 18 16Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path class="leafR" d="M52 50C52 40.5 59 36 69 36c-1.3 10.5-9 14-17 14Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>
    <div class="word">heartwood</div>
    <div class="subline">growing your archive</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Adaptive splash pacing: sample the real frame rate and scale every
    // splash animation by --pace so the draw-in stays visible on slow
    // displays (same principle as DevicePace in the app, T14 log).
    (function () {
      var frames = 0;
      var start = performance.now();
      function sample() {
        frames++;
        if (frames >= 15) {
          var fps = frames / ((performance.now() - start) / 1000);
          var pace = Math.min(4, Math.max(1, 60 / Math.max(fps, 1)));
          document.documentElement.style.setProperty('--pace', pace);
          return;
        }
        requestAnimationFrame(sample);
      }
      requestAnimationFrame(sample);
    })();
    // Diagnostic: helps identify why animations may not render in some
    // browsers (reduced-motion preference / GPU renderer). Check the console.
    window.addEventListener('flutter-first-frame', function () {
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var canvas = document.createElement('canvas');
      var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      var renderer = 'no-webgl';
      var webgl2 = !!canvas.getContext('webgl2');
      if (gl) {
        var info = gl.getExtension('WEBGL_debug_renderer_info');
        renderer = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : 'webgl';
      }
      console.log('[heartwood] prefers-reduced-motion:', reduced,
        '| webgl2:', webgl2, '| renderer:', renderer);
    });
    // The sprout sequence takes ~1.6s at 60fps; hold the splash at least that
    // long (scaled by pace) so the draw-in is never cut off, then fade once
    // Flutter is ready.
    var bootStart = Date.now();
    window.addEventListener('flutter-first-frame', function () {
      var pace = parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--pace')) || 1;
      var elapsed = Date.now() - bootStart;
      var wait = Math.max(0, 1600 * pace - elapsed) + 400 * pace;
      setTimeout(function () {
        var s = document.getElementById('hw-splash');
        if (s) s.classList.add('done');
        // Remove the splash from the DOM once faded so its infinite CSS
        // animations stop ticking entirely (weak GPUs pay for them even
        // when invisible).
        setTimeout(function () {
          var el = document.getElementById('hw-splash');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 900 * pace);
        // Tell Flutter the splash has lifted so entrance animations start.
        window.dispatchEvent(new Event('hw-boot-done'));
      }, wait);
    });
    // Safety net: never trap the user on the splash.
    setTimeout(function () {
      var s = document.getElementById('hw-splash');
      if (s) s.classList.add('done');
    }, 25000);
  </script>
</body>
</html>
